<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Karin´s MedicinRegner</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">

    <meta name="theme-color" content="#007aff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MedicinRegner">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding:
                max(20px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #e8eef8;
            background:
                radial-gradient(ellipse at top, rgba(0, 122, 255, 0.18), transparent 55%),
                #080d16;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: min(100%, 440px);
            padding: clamp(24px, 6vw, 36px);
            background: linear-gradient(160deg, #151f30, #0d1420 72%);
            border: 1px solid rgba(176, 199, 230, 0.14);
            border-radius: 26px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 30px;
            text-align: center;
            color: #f3f7ff;
            font-size: clamp(1.7rem, 7vw, 2.15rem);
            line-height: 1.2;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
            color: #d6e0ef;
        }

        input {
            width: 100%;
            min-height: 58px;
            padding: 15px 16px;
            color: #f3f7ff;
            background: #0a111d;
            border: 1px solid #334258;
            border-radius: 12px;
            font: inherit;
            font-size: 17px;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .koncentration-input {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }

        .koncentration-input input {
            min-width: 0;
            padding-right: 10px;
            padding-left: 10px;
            text-align: center;
        }

        .enhed,
        .skilletegn {
            color: #b6c4d7;
            font-weight: bold;
        }

        input::placeholder {
            color: #77869b;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.2);
        }

        .knapper {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 12px;
            margin-top: 22px;
        }

        button {
            min-height: 58px;
            padding: 12px 16px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 160ms ease, background-color 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 3px solid #b6d7ff;
            outline-offset: 3px;
        }

        .beregn-knap {
            color: #fff;
            background: #1677e8;
        }

        .beregn-knap:hover {
            background: #2788f5;
        }

        .nulstil-knap {
            color: #d5dfed;
            background: #263449;
        }

        .nulstil-knap:hover {
            background: #33445c;
        }

        .resultat {
            margin-top: 26px;
            padding: 20px 16px;
            text-align: center;
            background: rgba(5, 11, 20, 0.6);
            border: 1px solid rgba(176, 199, 230, 0.12);
            border-radius: 16px;
        }

        .resultat p {
            margin: 0 0 8px;
            color: #b6c4d7;
        }

        .ml {
            color: #70b5ff;
            font-size: clamp(2.2rem, 10vw, 2.8rem);
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #regnestykke {
            margin: 10px 0 0;
            color: #91a2b9;
            font-size: 14px;
        }

        .fagligt-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 16px;
            padding: 15px 16px;
            color: #e8eef8;
            text-decoration: none;
            background: rgba(22, 119, 232, 0.1);
            border: 1px solid rgba(112, 181, 255, 0.28);
            border-radius: 14px;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .fagligt-link:hover {
            background: rgba(22, 119, 232, 0.18);
            border-color: rgba(112, 181, 255, 0.55);
        }

        .fagligt-link:focus-visible {
            outline: 3px solid #b6d7ff;
            outline-offset: 3px;
        }

        .fagligt-link-text {
            display: grid;
            gap: 4px;
        }

        .fagligt-link small {
            color: #a9bad0;
            font-size: 13px;
            line-height: 1.4;
        }

        .fagligt-link-pil {
            color: #70b5ff;
            font-size: 24px;
        }

        @media (max-width: 360px) {
            .app {
                padding: 24px 20px;
            }

            .knapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>  

<main class="app">

    <h1>💊 Karin´s Medicinberegner</h1>

    <label for="dosis">Ordineret dosis (mg)</label>
    <input type="number" id="dosis" inputmode="decimal" step="any" placeholder="fx 12">

    <label for="koncentration">Koncentration</label>
    <div class="koncentration-input">
        <input type="number" id="koncentration" aria-label="Koncentration i milligram" inputmode="decimal" step="any" placeholder="fx 6">
        <span class="enhed" aria-hidden="true">mg</span>
        <span class="skilletegn" aria-hidden="true">/</span>
        <input type="number" id="koncentrationVolumen" aria-label="Koncentrationens volumen i milliliter" inputmode="decimal" step="any" value="1">
        <span class="enhed" aria-hidden="true">ml</span>
    </div>

    <div class="knapper">
        <button class="beregn-knap" type="button" onclick="beregn()">Beregn</button>
        <button class="nulstil-knap" type="button" onclick="nulstil()">Nulstil</button>
    </div>

    <div class="resultat">
        <p>Du skal trække op:</p>
        <div class="ml" id="resultat">- ml</div>
        <p id="regnestykke"></p>
    </div>

    <a class="fagligt-link" href="./faglige-emner.html">
        <span class="fagligt-link-text">
            <strong>Faglige emner</strong>
            <small>Hygiejne, observationer og kommunikation</small>
        </span>
        <span class="fagligt-link-pil" aria-hidden="true">→</span>
    </a>

</main>

<script>

function beregn() {

    let dosis = Number(document.getElementById("dosis").value);
    let koncentration = Number(document.getElementById("koncentration").value);
    let koncentrationVolumen = Number(document.getElementById("koncentrationVolumen").value);

    let resultat = document.getElementById("resultat");
    let regnestykke = document.getElementById("regnestykke");

    if (koncentration === 0 || koncentrationVolumen === 0) {
        resultat.innerText = "Koncentration skal være over 0";
        regnestykke.innerText = "";
        return;
    }

    if (
        !Number.isFinite(dosis) ||
        !Number.isFinite(koncentration) ||
        !Number.isFinite(koncentrationVolumen) ||
        dosis <= 0 ||
        koncentration < 0 ||
        koncentrationVolumen < 0
    ) {
        resultat.innerText = "Kontrollér værdier";
        regnestykke.innerText = "";
        return;
    }

    let ml = dosis / (koncentration / koncentrationVolumen);

    // Afrund til maks. 2 decimaler
    let mlAfrundet = Math.round(ml * 100) / 100;

    resultat.innerText =
        mlAfrundet.toLocaleString("da-DK") + " ml";

    regnestykke.innerText =
        dosis.toLocaleString("da-DK") +
        " mg ÷ " +
        "(" +
        koncentration.toLocaleString("da-DK") +
        " mg / " +
        koncentrationVolumen.toLocaleString("da-DK") +
        " ml) = " +
        mlAfrundet.toLocaleString("da-DK") +
        " ml";
}

function nulstil() {
    document.getElementById("dosis").value = "";
    document.getElementById("koncentration").value = "";
    document.getElementById("koncentrationVolumen").value = "1";
    document.getElementById("resultat").innerText = "- ml";
    document.getElementById("regnestykke").innerText = "";
    document.getElementById("dosis").focus();
}

</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./Service-worker.js")
            .catch(error => {
                console.error("Service Worker fejl:", error);
            });
    });
}
</script>

</body>
</html>
